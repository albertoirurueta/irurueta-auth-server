# Local development services. DEV ONLY: the credentials below are throwaway values for a local container
# and must never be reused anywhere else.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: authserver
      POSTGRES_PASSWORD: authserver-dev-only # pragma: allowlist secret
      POSTGRES_DB: authserver
    ports:
      - "5432"
    volumes:
      - ./compose/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authserver -d authserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
