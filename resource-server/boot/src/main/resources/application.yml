spring:
  application:
    name: resource-server
  security:
    oauth2:
      resourceserver:
        jwt:
          # The JWT decoder resolves the issuer metadata lazily, on the first request.
          issuer-uri: ${AUTH_ISSUER:http://localhost:9000}
          # Only tokens whose "aud" claim lists one of these audiences are accepted; it must not be empty.
          # The opaque profile applies the same audiences to the introspection response.
          audiences: ${RESOURCE_SERVER_AUDIENCES:resource-server}

# RFC 9470 step-up authentication required to delete a document: the token must carry this acr and an auth_time no
# older than max-age, otherwise the request is answered 401 insufficient_user_authentication.
resourceserver:
  step-up:
    enabled: true
    acr-values: urn:irurueta:acr:mfa
    max-age: PT5M

springdoc:
  # The OpenAPI document is published; the Swagger UI is not shipped.
  swagger-ui:
    enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
