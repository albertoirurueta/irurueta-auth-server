name: Build and test

# The example is never deployed: this workflow builds the reactor, runs every build gate (Checkstyle, PMD/CPD,
# SpotBugs, the aggregated JaCoCo check, enforcer and ArchUnit), the unit (*Test) and integration (*IT,
# Testcontainers) tests and the Playwright end-to-end test, then sends the analysis to SonarCloud when a token exists.
on:
  push:
    branches: [ main, develop, 'release_*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # empty on forks and on pull requests from forks: the Sonar step is skipped then
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarCloud needs the full history to attribute new code and blame
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The e2e-tests module drives headless Chromium through Playwright for Java, which downloads the browser on
      # first use; caching it keeps later runs offline for that step. Docker (preinstalled on ubuntu-latest) backs
      # the Testcontainers PostgreSQL.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Build, analyse and test
        run: ./mvnw -B -ntp clean verify

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp sonar:sonar

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco*/
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 14
