spring:
  application:
    name: bff
  security:
    oauth2:
      client:
        registration:
          bff:
            provider: auth-server
            client-id: bff
            # Never commit the secret: the auth server logs it at first dev start, export it as BFF_CLIENT_SECRET.
            client-secret: ${BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
        provider:
          auth-server:
            issuer-uri: ${AUTH_ISSUER:http://localhost:9000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
