<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth server example</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/app.js"></script>
</head>
<body>
<main>
    <h1 id="main-heading" tabindex="-1">Auth server example</h1>

    <p id="status" role="status" aria-live="polite">Checking your session&hellip;</p>
    <p id="error" class="error" role="alert" aria-live="assertive" hidden></p>
    <p id="retry" hidden><a href="/bff/login?returnTo=%2F">Try signing in again</a></p>

    <section id="signed-out" aria-labelledby="signed-out-heading" hidden>
        <h2 id="signed-out-heading">You are signed out</h2>
        <p>Sign in to see your profile and your documents.</p>
        <div class="actions">
            <button type="button" id="sign-in">Sign in</button>
        </div>
    </section>

    <section id="profile" aria-labelledby="profile-heading" hidden>
        <h2 id="profile-heading">Your profile</h2>
        <dl>
            <dt>Name</dt>
            <dd id="profile-name"></dd>
            <dt>Email</dt>
            <dd id="profile-email"></dd>
            <dt>Subject</dt>
            <dd id="profile-subject"></dd>
            <dt>Roles</dt>
            <dd id="profile-roles"></dd>
        </dl>
        <div class="actions">
            <button type="button" id="load-documents">Load documents</button>
            <button type="button" id="sign-out">Sign out</button>
        </div>
    </section>

    <section id="documents" aria-labelledby="documents-heading" hidden>
        <h2 id="documents-heading">Documents</h2>
        <p id="documents-empty" hidden>You have no documents.</p>
        <ul id="documents-list"></ul>
    </section>
</main>
</body>
</html>
<!-- end::bff-spa[] -->
