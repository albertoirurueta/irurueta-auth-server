spring:
  application:
    name: bff
  datasource:
    # Placeholders: the real values come from the environment (or from compose in the dev profile).
    url: ${BFF_DB_URL:jdbc:postgresql://localhost:5432/bff}
    username: ${BFF_DB_USER:bff}
    password: ${BFF_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # The schema is owned by Flyway (V300), never created by Spring Session.
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          bff:
            provider: auth-server
            client-id: bff
            # Never commit the secret: the auth server logs it at first dev start, export it as BFF_CLIENT_SECRET.
            client-secret: ${BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # documents.read and documents.delete let the BFF list and delete documents on the resource server (each
            # operation there needs its scope); the user grants them on the consent page. The seeded bff client of the
            # auth server allows both.
            scope: openid,profile,documents.read,documents.delete
        provider:
          auth-server:
            issuer-uri: ${AUTH_ISSUER:http://localhost:9000}

server:
  port: 8080

bff:
  resource-server:
    # Base URI of the resource server the generated documents client calls (with the access token of the user).
    base-uri: ${RESOURCE_SERVER_URI:http://localhost:8081}
  login:
    # Relative paths the SPA may ask to return to after the login (an entry ending in / also allows what is below it).
    allowed-return-paths:
      - /
      - /index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
