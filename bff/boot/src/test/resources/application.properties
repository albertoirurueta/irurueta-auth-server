# Test values only: a provider with explicit endpoints avoids the issuer discovery request,
# so tests need no live authorization server.
spring.security.oauth2.client.registration.bff.client-secret=test-only-not-a-secret
spring.security.oauth2.client.registration.bff.provider=test-provider
spring.security.oauth2.client.provider.test-provider.authorization-uri=http://localhost:9000/oauth2/authorize
spring.security.oauth2.client.provider.test-provider.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.test-provider.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.client.provider.test-provider.user-name-attribute=sub
