<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{ott.link.subject}">Your sign-in link</title>
</head>
<body>
<p th:text="#{ott.link.intro}">Open this link to sign in:</p>
<p><a th:href="${link}" th:text="#{ott.link.action}">Sign in</a></p>
<p><span th:text="${link}">https://example.com</span></p>
<p th:text="#{ott.link.validity(${validMinutes})}">The link is valid for 10 minute(s).</p>
<p th:text="#{ott.ignore}">If you did not request it you can ignore this message.</p>
</body>
</html>
