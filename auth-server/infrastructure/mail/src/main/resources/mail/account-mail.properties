mail.verification.subject=Confirm your e-mail address
mail.verification.body=\
  Welcome!\n\
  \n\
  To confirm your e-mail address open this link:\n\
  {0}\n\
  \n\
  If you did not create an account you can ignore this message.
mail.already-registered.subject=Your e-mail address is already registered
mail.already-registered.body=\
  Someone tried to register this e-mail address again, but it already belongs to an account.\n\
  \n\
  If it was you, sign in at {0} or reset your credentials from the sign-in page. Otherwise you can \
  ignore this message.
mail.reset.subject=Choose a new sign-in secret
mail.reset.body=\
  A reset was requested for your account.\n\
  \n\
  To choose a new one open this link:\n\
  {0}\n\
  \n\
  The link can be used once and expires soon. If you did not ask for it you can ignore this message.
