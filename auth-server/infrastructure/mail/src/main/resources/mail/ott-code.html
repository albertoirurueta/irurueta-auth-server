<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{ott.code.subject}">Your sign-in code</title>
</head>
<body>
<p th:text="#{ott.code.intro}">Use this code to sign in:</p>
<p style="font-size: 1.5em; letter-spacing: 0.2em;"><strong th:text="${code}">123456</strong></p>
<p th:text="#{ott.code.validity(${validMinutes})}">The code is valid for 10 minute(s).</p>
<p th:text="#{ott.ignore}">If you did not request it you can ignore this message.</p>
</body>
</html>
