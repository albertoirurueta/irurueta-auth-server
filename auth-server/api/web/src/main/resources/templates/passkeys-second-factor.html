<!--
  Passkey as a second factor (PasskeySecondFactorFragment): offered to a user who has a passkey. The options the
  framework answers for a signed-in session only allow the credentials of that user. A passkey is a strong factor, so
  it completes the sign-in on its own, together with the password the session already holds. The script and its
  data attributes are the ones of passkeys.html.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- tag::passkeys-second-factor[] -->
<div th:fragment="form" th:if="${passkeysAvailable}" class="passkey-second-factor" data-passkey-login
     th:attr="data-csrf-header=${_csrf?.headerName},data-csrf-token=${_csrf?.token}"
     th:data-error-url="@{/login/second-factor?error}" th:data-failure-message="#{passkeys.login.failed}">
  <h2 th:text="#{passkeys.second.heading}">Use a passkey</h2>
  <p th:text="#{passkeys.second.instructions}">Confirm with a passkey registered to your account.</p>
  <button type="button" data-passkey-button th:text="#{passkeys.second.button}">Use a passkey</button>
  <p role="alert" data-passkey-error hidden></p>
  <script th:src="@{/js/passkeys.js}" defer></script>
</div>
<!-- end::passkeys-second-factor[] -->
</body>
</html>
