<!--
  Sign in with an external provider (SocialLoginMethodFragment): one link per configured provider, to the framework
  endpoint that starts the sign-in. The providers come from the bean that contributes this fragment, so the page lists
  exactly the ones that are configured; the link text of each is the message social.login.<provider>.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- tag::social-login-fragment[] -->
<div th:fragment="login" class="social-login">
  <h2 th:text="#{social.login.heading}">Or sign in with</h2>
  <ul>
    <li th:each="provider : ${@socialLoginMethodFragment.providers()}">
      <a th:href="@{/oauth2/authorization/{provider}(provider=${provider})}" th:attr="data-social-provider=${provider}"
         th:text="#{${'social.login.' + provider}}">Sign in with a provider</a>
    </li>
  </ul>
</div>
<!-- end::social-login-fragment[] -->
</body>
</html>
