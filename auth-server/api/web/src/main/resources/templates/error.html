<!-- Generic text only: no stack trace, exception message, path or identifier is ever rendered here. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="#{error.title}">Something went wrong</title>
</head>
<body>
<main>
  <h1 th:text="#{error.heading}">Something went wrong</h1>
  <p role="alert" th:text="#{${messageKey}}">The request could not be completed.</p>
  <p><a th:href="@{/login}" th:text="#{error.back}">Back to the sign-in page</a></p>
</main>
</body>
</html>
