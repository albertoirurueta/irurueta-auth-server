<!--
  Magic link confirmation page (OttPagesController.ottConfirmPage). Opening the
  link only shows this page; the token is consumed when the button posts it to /login/ott, so a mail scanner that
  follows the link does not use it up.
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="#{ott.confirm.title}">Confirm sign-in</title>
</head>
<body>
<main>
  <h1 th:text="#{ott.confirm.heading}">Confirm your sign-in</h1>
  <p id="ott-confirm-instructions" th:text="#{ott.confirm.instructions}">Press the button to continue.</p>
  <form method="post" th:action="@{${postPath}}">
    <input type="hidden" th:name="${codeField}" th:value="${token}">
    <button type="submit" autofocus aria-describedby="ott-confirm-instructions" th:text="#{ott.confirm.submit}">Continue</button>
  </form>
</main>
</body>
</html>
