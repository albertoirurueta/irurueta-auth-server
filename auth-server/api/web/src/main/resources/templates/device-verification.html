<!-- tag::device-verification-page[] -->
<!--
  Device verification page (DeviceVerificationController.deviceVerificationPage): the form where the user types the code
  the device shows (RFC 8628). It posts the code to the framework's endpoint, which asks for consent on the consent page
  and sends the browser back here with ?error when the code is refused and ?success when the device was approved
  (th:action adds the CSRF field). A failed attempt is announced in an assertive live region and never says why.
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="#{device.title}">Connect a device</title>
</head>
<body>
<main>
  <h1 th:text="#{device.heading}">Connect a device</h1>
  <p th:if="${approved}" class="success" role="status" th:text="#{device.success}">The device may continue now.</p>
  <div th:unless="${approved}">
    <p th:text="#{device.intro}">Type the code your device shows to approve it.</p>
    <div aria-live="assertive" role="alert">
      <p th:if="${failed}" class="error" th:text="#{device.error}">That code is not valid.</p>
    </div>
    <form method="post" th:action="@{/oauth2/device_verification}">
      <p>
        <label for="user-code" th:text="#{device.code}">Code</label>
        <input type="text" id="user-code" name="user_code" th:value="${userCode}" required autofocus maxlength="32"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </p>
      <button type="submit" id="verify" th:text="#{device.submit}">Continue</button>
    </form>
  </div>
</main>
</body>
</html>
<!-- end::device-verification-page[] -->
