<!--
  Recovery codes page (RecoveryCodesPageController): the codes generated when an authenticator app was enrolled during
  the sign-in, shown once (the controller takes them out of the session), and a "Continue" link that resumes the
  request the sign-in interrupted.
-->
<!-- tag::totp-recovery-codes-template[] -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="#{recoveryCodes.title}">Recovery codes</title>
</head>
<body>
<main>
  <h1 th:text="#{recoveryCodes.heading}">Save your recovery codes</h1>
  <th:block th:if="${!#lists.isEmpty(recoveryCodes)}">
    <p th:text="#{recoveryCodes.instructions}">Keep these codes somewhere safe. Each one signs you in once if you lose
      your authenticator app. They will not be shown again.</p>
    <ul class="recovery-codes">
      <li th:each="code : ${recoveryCodes}"><code th:text="${code}">ABCDE12345</code></li>
    </ul>
  </th:block>
  <p th:if="${#lists.isEmpty(recoveryCodes)}" th:text="#{recoveryCodes.none}">The recovery codes have already been
    shown.</p>
  <p><a id="continue" class="button" th:href="${continueUrl}" th:text="#{recoveryCodes.continue}">Continue</a></p>
</main>
</body>
</html>
<!-- end::totp-recovery-codes-template[] -->
