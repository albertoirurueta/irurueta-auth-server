<!--
  Sign in with a client certificate (X509LoginMethodFragment): one button that posts to Spring Security's X.509 filter
  (POST /login/x509), never a link, so a cross-site page cannot make the browser sign in with its certificate; th:action
  adds the CSRF field. The address comes from the bean: the relative path, or the dedicated TLS port of the same host
  when only that transport is on and the page is served on another port.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- tag::x509-login-fragment[] -->
<form th:fragment="login" class="x509-login" method="post" th:action="${@x509LoginMethodFragment.action()}">
  <h2 th:text="#{x509.login.heading}">Sign in with a certificate</h2>
  <p th:text="#{x509.login.hint}">Your browser or smart card will ask which certificate to present.</p>
  <button type="submit" th:text="#{x509.login.button}">Use my certificate</button>
</form>
<!-- end::x509-login-fragment[] -->
</body>
</html>
