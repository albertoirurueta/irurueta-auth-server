<!--
  Passkey sign-in method (PasskeyLoginMethodFragment). The field carries the "username webauthn" autocomplete tokens, so
  the browser offers the passkeys it knows right in it (conditional mediation) and the user may also press the button.
  The script is an external same-origin file, which the Content-Security-Policy (default-src 'self') allows without a
  nonce. The container hands it the CSRF header and token (the WebAuthn endpoints keep CSRF protection) and the
  messages it shows.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- tag::passkeys-login[] -->
<div th:fragment="login" class="passkey-login" data-passkey-login
     th:attr="data-csrf-header=${_csrf?.headerName},data-csrf-token=${_csrf?.token}"
     th:data-error-url="@{/login?error}" th:data-failure-message="#{passkeys.login.failed}">
  <h2 th:text="#{passkeys.login.heading}">Sign in with a passkey</h2>
  <p>
    <label for="passkey-username" th:text="#{passkeys.login.username}">Username</label>
    <input type="text" id="passkey-username" name="passkey-username" autocomplete="username webauthn"
           data-passkey-field>
  </p>
  <button type="button" data-passkey-button th:text="#{passkeys.login.button}">Use a passkey</button>
  <p role="alert" data-passkey-error hidden></p>
  <script th:src="@{/js/passkeys.js}" defer></script>
</div>
<!-- end::passkeys-login[] -->
</body>
</html>
