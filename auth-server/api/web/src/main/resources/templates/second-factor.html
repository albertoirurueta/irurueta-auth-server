<!--
  Second-factor page. The second factors are not written here: every SecondFactorFragment bean contributes one (the
  TOTP and recovery-code forms are totp.html).
-->
<!-- tag::mfa-second-factor-page-template[] -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="#{secondFactor.title}">Second factor</title>
</head>
<body>
<main>
  <h1 th:text="#{secondFactor.heading}">Verify it is you</h1>
  <div th:if="${errorMessageKey != null}" role="alert" th:text="#{${errorMessageKey}}">The code is not valid.</div>
  <section th:each="fragment : ${fragments}" class="second-factor-method">
    <!-- SecondFactorFragment.reference() is the single source of the "template :: fragment" expression -->
    <div th:replace="~{__${fragment.reference()}__}"></div>
  </section>
</main>
</body>
</html>
<!-- end::mfa-second-factor-page-template[] -->
