<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <!-- tag::login-form[] -->
  <form method="post" th:action="@{${loginPath}}">
    <div th:if="${param.error}" role="alert">Invalid username or password.</div>
    <div th:if="${param.logout}" role="status">You have been signed out.</div>
    <p>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
    </p>
    <p>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </p>
    <button type="submit">Sign in</button>
  </form>
  <!-- end::login-form[] -->
  <section th:each="fragment : ${fragments}" class="login-method">
    <!-- LoginMethodFragment.reference() is the single source of the "template :: fragment" expression -->
    <div th:replace="~{__${fragment.reference()}__}"></div>
  </section>
</main>
</body>
</html>
