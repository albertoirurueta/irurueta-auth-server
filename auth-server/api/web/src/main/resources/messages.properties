# Texts of the server-rendered pages. Only this base file exists: the language of a page never depends on the
# platform the server runs on (spring.messages.fallback-to-system-locale is false).

# Login page
login.title=Sign in
login.heading=Sign in
login.username=Username
login.password=Password
login.submit=Sign in
login.logout=You have been signed out.
# Unknown user and wrong password share this text, so the page never reveals whether an account exists.
login.error.generic=Invalid username or password.
login.error.locked=This account is locked.
login.error.accountExpired=This account has expired.
login.error.credentialsExpired=Your password has expired.
login.error.disabled=This account is disabled.

# Consent page
consent.title=Authorize application
consent.heading=Authorize {0}
consent.intro={0} wants to access your account {1} with the following permissions.
consent.previous=You already granted these permissions:
consent.none=This application is not asking for any additional permission.
consent.allow=Allow
consent.deny=Deny
consent.scope.openid=Verify your identity
consent.scope.profile=Read your profile (name and username)
consent.scope.email=Read your e-mail address
consent.scope.documents.read=Read your documents
consent.scope.documents.delete=Delete your documents
consent.scope.offline_access=Keep you signed in

# Logout page
logout.title=Sign out
logout.heading=Sign out
logout.question=Do you want to sign out?
logout.confirm=Sign out

# Error page
error.title=Something went wrong
error.heading=Something went wrong
error.message=The request could not be completed. Please go back and try again.
error.notFound=The page you asked for does not exist.
error.forbidden=You are not allowed to do that.
error.back=Back to the sign-in page
