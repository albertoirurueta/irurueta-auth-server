# Texts of the server-rendered pages. Only this base file exists: the language of a page never depends on the
# platform the server runs on (spring.messages.fallback-to-system-locale is false).

# Login page
login.title=Sign in
login.heading=Sign in
login.username=Username
login.password=Password
login.submit=Sign in
login.logout=You have been signed out.
