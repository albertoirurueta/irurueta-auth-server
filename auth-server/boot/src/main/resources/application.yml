spring:
  application:
    name: auth-server
  messages:
    # the language of a response never depends on the platform the server runs on
    fallback-to-system-locale: false
  web:
    locale: en
    error:
      # Spring Boot's BasicErrorController answers /error. Its JSON body never carries the message, the stack trace or
      # the exception (those include-* default to never); the requested path is left out too, so the body is only the
      # timestamp, the status and its reason phrase. Browsers get templates/error.html through ErrorPageViewResolver.
      include-path: never
  datasource:
    # Placeholders: the real values come from the environment (or from compose in the dev profile).
    url: ${AUTHSERVER_DB_URL:jdbc:postgresql://localhost:5432/authserver}
    username: ${AUTHSERVER_DB_USER:authserver}
    password: ${AUTHSERVER_DB_PASSWORD:}
  mail:
    # SMTP relay; credentials, when the relay needs them, come from spring.mail.* environment variables only
    host: ${AUTHSERVER_MAIL_HOST:localhost}
    port: ${AUTHSERVER_MAIL_PORT:1025}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTHSERVER_ISSUER_URL:http://localhost:9000}

server:
  port: 9000

logging:
  level:
    # The password sign-in uses its own DaoAuthenticationProvider bean (PasswordAuthenticationConfiguration, which
    # checks the account status only after the password); Spring Security warns at startup that the
    # UserDetailsService bean is then not used to build one, which is exactly the intent.
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true

authserver:
  mail:
    from: ${AUTHSERVER_MAIL_FROM:no-reply@localhost}
    base-url: ${AUTHSERVER_ISSUER_URL:http://localhost:9000}
    locale: en
  api:
    # Audience a bearer token must list to call /api/** (the seeded clients get it too).
    audience: ${AUTHSERVER_API_AUDIENCE:auth-server}
  # tag::clients-seed-config[]
  clients:
    # Secret of the confidential bff client, from the environment only; empty means the client is not seeded.
    bff-secret: ${AUTHSERVER_BFF_CLIENT_SECRET:}
    # Redirect URIs (comma-separated) of the default clients. A client is seeded only when its redirect URIs are
    # configured: nothing is seeded by default, and no localhost URI exists outside the dev profile.
    bff:
      redirect-uris: ${AUTHSERVER_BFF_REDIRECT_URIS:}
      # URIs (comma-separated) the user may be sent to after an RP-initiated logout (/connect/logout); none by default
      post-logout-redirect-uris: ${AUTHSERVER_BFF_POST_LOGOUT_REDIRECT_URIS:}
    spa-public:
      redirect-uris: ${AUTHSERVER_SPA_REDIRECT_URIS:}
      post-logout-redirect-uris: ${AUTHSERVER_SPA_POST_LOGOUT_REDIRECT_URIS:}
  # end::clients-seed-config[]
  # tag::passkeys-config[]
  passkeys:
    # Relying party of the passkeys (WebAuthn). The id is the host name credentials are scoped to and the origins are
    # the ones browsers may run the ceremonies from: both default to the local development values and must be set to
    # the public host name of a real deployment.
    rp-name: ${AUTHSERVER_PASSKEYS_RP_NAME:Irurueta Auth Server}
    rp-id: ${AUTHSERVER_PASSKEYS_RP_ID:localhost}
    allowed-origins: ${AUTHSERVER_PASSKEYS_ALLOWED_ORIGINS:http://localhost:9000}
  # end::passkeys-config[]
  account:
    # Limits of the unauthenticated /api/account endpoints, per client address and per e-mail address.
    rate-limit:
      enabled: true
      window: PT15M
      per-client: 20
      per-email: 5
      max-tracked-keys: 10000
  ott:
    # tag::ott-config[]
    # Digits of the e-mail / SMS code, how long a code and a magic link stay valid, and how many wrong codes are
    # accepted before the code is spent. The values shown are the defaults of OttProperties.
    code-length: 6
    code-ttl: PT10M
    link-ttl: PT15M
    max-attempts: 5
    # end::ott-config[]
    # Limits of the one-time token endpoints (POST /ott/generate, POST /login/ott, POST /login/second-factor/ott and
    # the phone enrolment), per client address and per identifier.
    # tag::ott-rate-limit-config[]
    rate-limit:
      enabled: true
      window: PT15M
      generation-per-client: 20
      generation-per-identifier: 5
      verification-per-client: 30
      verification-per-identifier: 10
      max-tracked-keys: 10000
    # end::ott-rate-limit-config[]
    cleanup:
      # when the expired codes, phone verifications, SMS ledger entries and link tokens are deleted (every hour)
      cron: "0 15 * * * *"
  # tag::sms-config[]
  sms:
    # Region numbers typed without a country prefix are read in, and the regions SMS may be sent to (ISO 3166-1
    # alpha-2, upper case). The values shown are the defaults of SmsProperties.
    default-region: US
    allowed-countries: US,ES,GB
    # Cost caps in millionths of the billing currency, so a bug or an attack cannot run up the bill: the price assumed
    # for a country without an entry in cost-per-country-micros, and the most that may be spent per window and per day.
    default-cost-micros: 50000
    window: PT1H
    window-cap-micros: 5000000
    daily-cap-micros: 20000000
    # Verification code of a phone being enrolled, and how long the spend ledger is kept.
    verification-code-length: 6
    verification-code-ttl: PT10M
    verification-max-attempts: 5
    ledger-retention: P2D
    # Which gateway sends the messages is chosen with a Spring profile, never with a property: "twilio" sends through
    # Twilio (application-twilio.yml) and "sns" through Amazon SNS (application-sns.yml, default AWS credential chain);
    # only "dev" and "test" log the message to a bounded in-memory outbox (the dev profile shows it at
    # /dev/sms-inbox). With none of these profiles the application refuses to start, so a deployment never silently
    # keeps its messages in memory.
  # end::sms-config[]
  # tag::social-config[]
  social:
    # Sign in with external providers (Google, Microsoft Entra ID, Apple, GitHub). A provider is enabled only when its
    # client-id has text, so nothing is configured until a deployment supplies the values. Every secret comes from the
    # environment and none is ever kept in a file. trust-mfa (default false) makes the provider's own multi-factor
    # authentication count: the sign-in is then accepted without a second factor only when the provider reports mfa in
    # its amr claim. Without it a federated sign-in is a primary factor and the second-factor flow applies.
    providers:
      google:
        client-id: ${AUTHSERVER_SOCIAL_GOOGLE_CLIENT_ID:}
        client-secret: ${AUTHSERVER_SOCIAL_GOOGLE_CLIENT_SECRET:}
        trust-mfa: ${AUTHSERVER_SOCIAL_GOOGLE_TRUST_MFA:false}
      microsoft:
        client-id: ${AUTHSERVER_SOCIAL_MICROSOFT_CLIENT_ID:}
        client-secret: ${AUTHSERVER_SOCIAL_MICROSOFT_CLIENT_SECRET:}
        # common, organizations, consumers, a tenant id or a domain; allowed-tenants limits a multi-tenant sign-in
        tenant: ${AUTHSERVER_SOCIAL_MICROSOFT_TENANT:common}
        allowed-tenants: ${AUTHSERVER_SOCIAL_MICROSOFT_ALLOWED_TENANTS:}
        trust-mfa: ${AUTHSERVER_SOCIAL_MICROSOFT_TRUST_MFA:false}
      apple:
        client-id: ${AUTHSERVER_SOCIAL_APPLE_CLIENT_ID:}
        team-id: ${AUTHSERVER_SOCIAL_APPLE_TEAM_ID:}
        key-id: ${AUTHSERVER_SOCIAL_APPLE_KEY_ID:}
        # the PKCS#8 PEM text of the .p8 key Apple issued
        private-key: ${AUTHSERVER_SOCIAL_APPLE_PRIVATE_KEY:}
        client-secret-ttl: PT5M
        trust-mfa: ${AUTHSERVER_SOCIAL_APPLE_TRUST_MFA:false}
      github:
        client-id: ${AUTHSERVER_SOCIAL_GITHUB_CLIENT_ID:}
        client-secret: ${AUTHSERVER_SOCIAL_GITHUB_CLIENT_SECRET:}
        trust-mfa: ${AUTHSERVER_SOCIAL_GITHUB_TRUST_MFA:false}
  # end::social-config[]
  # tag::x509-config[]
  x509:
    # Sign in with a client certificate, off unless enabled is true: the login page shows a button that posts to
    # POST /login/x509 with the CSRF token (a GET of that path never signs in). A certificate is bound to an account by
    # its SHA-256 fingerprint. Two transports, both off by default: a certificate a trusted reverse proxy forwards in a
    # header (forwarded-header, honoured only for a request that comes from one of trusted-proxies, addresses or CIDR
    # ranges), and a dedicated TLS port that requests a client certificate (port, with the server certificate in
    # key-store; the password comes from the environment, AUTHSERVER_X509_KEY_STORE_PASSWORD). With only the TLS port the
    # button posts to that port of the same host, so the main port must be https too (SameSite cookies are not sent
    # from an http page to an https one) or the login page must be opened on the TLS port.
    # trusted-proxies is compared with the client address the server sees after Spring Boot's handling of the forwarded
    # headers, which is the direct network peer only with server.forward-headers-strategy: none; native and framework
    # replace it with a value from X-Forwarded-For, which a client can forge, so the server refuses to start with a
    # forwarded-header and any strategy but none (also when the strategy is unset on a detected cloud platform, where
    # it defaults to native). Under the dev profile a self-signed server certificate is generated at the first start
    # under ~/.irurueta-auth-server/. amr is the value the tokens report: sc (smart card) or hwk (a key held in
    # hardware).
    enabled: ${AUTHSERVER_X509_ENABLED:false}
    forwarded-header: ${AUTHSERVER_X509_FORWARDED_HEADER:}
    trusted-proxies: ${AUTHSERVER_X509_TRUSTED_PROXIES:}
    port: ${AUTHSERVER_X509_PORT:0}
    key-store: ${AUTHSERVER_X509_KEY_STORE:}
    amr: ${AUTHSERVER_X509_AMR:sc}
  # end::x509-config[]
  # tag::device-config[]
  device:
    # Device authorization grant (RFC 8628): the attempts to verify a user code, which is short, are limited per client
    # address and per signed-in user, counted in a fixed window.
    rate-limit:
      enabled: true
      window: PT15M
      per-client: 30
      per-user: 10
  # end::device-config[]
  oidc:
    client-registration:
      # Dynamic client registration (/connect/register) is off unless explicitly enabled.
      enabled: false
