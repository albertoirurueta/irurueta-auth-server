# Sends the one-time codes by SMS through Amazon SNS (profile "sns"). There is nothing to set: the AWS SDK v2 default
# credential and region provider chain reads the environment (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION),
# the shared profile files or the instance role, so no credential ever appears in this repository.
