# LEGACY DEMO, never enable in production. The implicit grant (response_type=token) is removed from OAuth 2.1 because
# it leaks access tokens through the URL and browser history. This profile (legacy-implicit) only shows the risk and
# the mitigations (short lifetime, one client, one redirect URI, a restricted audience and scope). Use the
# authorization code flow with PKCE instead.
# tag::legacy-implicit-config[]
authserver:
  legacy-implicit:
    client-id: legacy-implicit-spa
    redirect-uri: ${AUTHSERVER_LEGACY_IMPLICIT_REDIRECT_URI:http://localhost:9000/legacy-implicit/}
    scopes: documents.read
    audience: resource-server
    # lifetime of the access token it issues, at most PT15M
    access-token-ttl: PT5M
# end::legacy-implicit-config[]
