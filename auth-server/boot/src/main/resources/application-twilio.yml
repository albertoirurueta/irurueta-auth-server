# Sends the one-time codes by SMS through Twilio (profile "twilio"). Everything comes from the environment; no value
# is ever written here. Set AUTHSERVER_SMS_TWILIO_FROM (a sender number in E.164) or
# AUTHSERVER_SMS_TWILIO_MESSAGING_SERVICE_SID, not both.
authserver:
  sms:
    twilio:
      account-sid: ${AUTHSERVER_SMS_TWILIO_ACCOUNT_SID:}
      auth-token: ${AUTHSERVER_SMS_TWILIO_AUTH_TOKEN:}
      from: ${AUTHSERVER_SMS_TWILIO_FROM:}
      messaging-service-sid: ${AUTHSERVER_SMS_TWILIO_MESSAGING_SERVICE_SID:}
