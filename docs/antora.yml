name: irurueta-auth-server
version: 1.0.0
title: Irurueta Auth Server
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    # dir is relative to the repository root (the worktree), not to docs/. Only src/** is scanned (plus pom.xml for the
    # modules whose pom has tagged regions), so target/ and node_modules/ never reach the site.
    # One scan per module (its directory from the repository root), so a new module needs a new scan here.
    # Copies each module's sources into the example$ family so the guide can include tagged regions, for example
    # include::irurueta-auth-server::example$auth-server/api/web/src/main/java/...[tag=security-chains]
    - scan:
        - dir: auth-server/domain
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/domain
        - dir: auth-server/application
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/application
        - dir: auth-server/infrastructure/persistence
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/auth-server/infrastructure/persistence
        - dir: auth-server/infrastructure/keys
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/infrastructure/keys
        - dir: auth-server/infrastructure/mail
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/infrastructure/mail
        - dir: auth-server/infrastructure/sms
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/infrastructure/sms
        - dir: auth-server/infrastructure/github
          files: 'src/**'
          into: modules/ROOT/examples/auth-server/infrastructure/github
        - dir: auth-server/api/web
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/auth-server/api/web
        - dir: auth-server/boot
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/auth-server/boot
        - dir: bff/domain
          files: 'src/**'
          into: modules/ROOT/examples/bff/domain
        - dir: bff/application
          files: 'src/**'
          into: modules/ROOT/examples/bff/application
        - dir: bff/infrastructure/session
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/bff/infrastructure/session
        - dir: bff/infrastructure/resourceserver
          files: 'src/**'
          into: modules/ROOT/examples/bff/infrastructure/resourceserver
        - dir: bff/api/web
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/bff/api/web
        - dir: bff/boot
          files: 'src/**'
          into: modules/ROOT/examples/bff/boot
        - dir: resource-server/domain
          files: 'src/**'
          into: modules/ROOT/examples/resource-server/domain
        - dir: resource-server/application
          files: 'src/**'
          into: modules/ROOT/examples/resource-server/application
        - dir: resource-server/infrastructure/memory
          files: 'src/**'
          into: modules/ROOT/examples/resource-server/infrastructure/memory
        - dir: resource-server/api/web
          files: '{pom.xml,src/**}'
          into: modules/ROOT/examples/resource-server/api/web
        - dir: resource-server/boot
          files: 'src/**'
          into: modules/ROOT/examples/resource-server/boot
        - dir: service-client/domain
          files: 'src/**'
          into: modules/ROOT/examples/service-client/domain
        - dir: service-client/application
          files: 'src/**'
          into: modules/ROOT/examples/service-client/application
        - dir: service-client/infrastructure/resourceserver
          files: 'src/**'
          into: modules/ROOT/examples/service-client/infrastructure/resourceserver
        - dir: service-client/boot
          files: 'src/**'
          into: modules/ROOT/examples/service-client/boot
        - dir: test-support
          files: 'src/**'
          into: modules/ROOT/examples/test-support
        - dir: e2e-tests
          files: 'src/**'
          into: modules/ROOT/examples/e2e-tests
        # the API contracts, so the guide can include tagged regions of them, for example
        # include::irurueta-auth-server::example$apis/auth-server/rest-server/auth-server-api-v1.yaml[tag=account-api]
        - dir: apis
          files: '**/*.yaml'
          into: modules/ROOT/examples/apis
        # '~+' is the repository root; a plain '.' would mean the docs/ start path
        - dir: '~+'
          files: '{pom.xml,compose.yaml}'
          into: modules/ROOT/examples
        # the CI workflows, so the guide can include tagged regions of them, for example
        # include::irurueta-auth-server::example$.github/workflows/build.yml[tag=...]
        # Finding: the Collector globs with fast-glob (dot: false), which skips dot-directories only for wildcards;
        # a literal '.github' segment in the pattern matches, so no extra option is needed (verified).
        - dir: '~+'
          files: '.github/workflows/{build,docs}.yml'
          into: modules/ROOT/examples
asciidoc:
  attributes:
    # Base URL of the OAuth Reference in the Irurueta Docs site (repository albertoirurueta/docs, published at
    # www.irurueta.com). This repository is not a content source of that site, so its pages are linked by URL, never by
    # cross-component xref: {oauth-ref}/device-authorization-grant.html[Device Authorization Grant]
    oauth-ref: https://www.irurueta.com/backend/oauth
